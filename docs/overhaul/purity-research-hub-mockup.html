<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purity Research Hub · Mockup</title>
<style>
:root{
  --teal:#00665E;--teal-dark:#004d47;--aqua:#009F8D;--gold:#F1B434;--beige:#D5CCBA;--brown:#3D290D;
  --bg:#f3f5f5;--card:#ffffff;--soft:#eef4f3;--line:#dfe5e4;--ink:#1d2b2a;--muted:#5f6f6d;
  --pass:#1f8a5b;--pass-bg:#e4f4ec;--nd:#2f7f75;--nd-bg:#e6f2f0;--watch:#b7791f;--watch-bg:#fdf3dd;
  --fail:#c0392b;--fail-bg:#fbe7e4;--incon:#7a5ea8;--incon-bg:#f0ebf8;--info:#5f6f6d;--info-bg:#eef1f1;
  --detect:#2f5aa8;--detect-bg:#e8eefa;--cleared:#3b7d4f;--cleared-bg:#e6f1e9;--exempt:#8a8f8e;--exempt-bg:#f1f2f2;
  --header-a:#00665E;--header-b:#009F8D;--radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --teal:#3fc1b0;--teal-dark:#9ee3d8;--aqua:#2fd0bd;--gold:#f4c35a;--beige:#5b5345;--brown:#e9dcc6;
  --bg:#0f1716;--card:#16201f;--soft:#1c2a28;--line:#2a3836;--ink:#e3ecea;--muted:#9fb1ae;
  --pass:#5fd39b;--pass-bg:#173326;--nd:#6fcfc2;--nd-bg:#14302c;--watch:#f0b955;--watch-bg:#3a2d12;
  --fail:#ff8a7a;--fail-bg:#3d1c18;--incon:#c3a8f0;--incon-bg:#2c2340;--info:#a9b8b5;--info-bg:#222d2c;
  --detect:#8fb2f5;--detect-bg:#1c2740;--cleared:#8fd3a3;--cleared-bg:#1a2e21;--exempt:#a9adac;--exempt-bg:#242a29;
  --header-a:#00524b;--header-b:#00786b;
}}
:root[data-theme="dark"]{
  --teal:#3fc1b0;--teal-dark:#9ee3d8;--aqua:#2fd0bd;--gold:#f4c35a;--beige:#5b5345;--brown:#e9dcc6;
  --bg:#0f1716;--card:#16201f;--soft:#1c2a28;--line:#2a3836;--ink:#e3ecea;--muted:#9fb1ae;
  --pass:#5fd39b;--pass-bg:#173326;--nd:#6fcfc2;--nd-bg:#14302c;--watch:#f0b955;--watch-bg:#3a2d12;
  --fail:#ff8a7a;--fail-bg:#3d1c18;--incon:#c3a8f0;--incon-bg:#2c2340;--info:#a9b8b5;--info-bg:#222d2c;
  --detect:#8fb2f5;--detect-bg:#1c2740;--cleared:#8fd3a3;--cleared-bg:#1a2e21;--exempt:#a9adac;--exempt-bg:#242a29;
  --header-a:#00524b;--header-b:#00786b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
.mockbar{background:var(--brown);color:#fff;font-size:.78em;text-align:center;padding:5px 12px;letter-spacing:.3px}
:root[data-theme="dark"] .mockbar{color:#1d2b2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mockbar{color:#1d2b2a}}
.header{background:linear-gradient(135deg,var(--header-a) 0%,var(--header-b) 100%);color:#fff;padding:22px 16px 18px;border-bottom:4px solid var(--gold)}
.header-inner{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header-logo{height:42px;width:auto;filter:brightness(0) invert(1);opacity:.95}
.header h1{margin:0;font-size:1.6em;font-weight:700;letter-spacing:.2px}
.header .subtitle{font-size:.92em;opacity:.92}
.header .spacer{flex:1}
.hdr-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hdr-controls label{font-size:.78em;opacity:.9;display:flex;gap:6px;align-items:center}
.hdr-controls select,.hdr-controls button{font:inherit;font-size:.85em;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;cursor:pointer}
.hdr-controls select option{color:#1d2b2a}
.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-inner{max-width:1380px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
.tab{background:none;border:0;padding:13px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--teal)}
.tab[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--aqua);background:var(--soft)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
main{max-width:1380px;margin:0 auto;padding:22px 16px 60px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtab{font:inherit;font-size:.86em;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.subtab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .subtab[aria-selected="true"]{color:#0f1716}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .subtab[aria-selected="true"]{color:#0f1716}}
.grid{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--line)}
.kpi .lbl{font-size:.72em;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
.kpi .val{font-size:1.85em;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}
.kpi .sub{font-size:.8em;color:var(--muted);margin-top:2px}
.kpi.alert .val{color:var(--fail)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card h2{margin:0 0 4px;font-size:1.1em;color:var(--teal)}
.card h3{margin:14px 0 6px;font-size:.95em}
.hint{color:var(--muted);font-size:.86em;margin:0 0 12px}
.small{font-size:.86em}.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76em;font-weight:700;white-space:nowrap}
.s-fail{background:var(--fail-bg);color:var(--fail)}.s-watch{background:var(--watch-bg);color:var(--watch)}
.s-pass{background:var(--pass-bg);color:var(--pass)}.s-nd{background:var(--nd-bg);color:var(--nd)}
.s-incon{background:var(--incon-bg);color:var(--incon)}.s-info{background:var(--info-bg);color:var(--info)}
.s-detect{background:var(--detect-bg);color:var(--detect)}.s-cleared{background:var(--cleared-bg);color:var(--cleared)}
.s-exempt{background:var(--exempt-bg);color:var(--exempt)}.s-pending{background:var(--info-bg);color:var(--info);border:1px dashed var(--muted)}
.route{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.74em;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:var(--soft);color:var(--teal);border:1px solid var(--line)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88em}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:700;color:var(--muted);font-size:.8em;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cell{display:inline-block;min-width:64px;text-align:center;border-radius:6px;padding:3px 6px;font-weight:600;font-variant-numeric:tabular-nums}
.attn{display:grid;gap:10px}
.attn-item{display:grid;grid-template-columns:6px 1fr;gap:12px;background:var(--soft);border-radius:8px;padding:12px 14px 12px 0;overflow:hidden}
.attn-item .bar{border-radius:0 4px 4px 0}
.attn-item h3{margin:0 0 3px;font-size:.96em}
.attn-item p{margin:0;color:var(--muted);font-size:.86em}
.askbox{display:flex;gap:10px;align-items:stretch}
.askbox input{flex:1;font:inherit;font-size:1.02em;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
.btn{font:inherit;font-weight:700;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0f1716}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1716}}
.btn.ghost{background:none;color:var(--teal);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:.82em;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:hover{border-color:var(--aqua);color:var(--teal)}
.chip.on{background:var(--soft);border-color:var(--teal);color:var(--teal);font-weight:700}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;display:grid;gap:6px;text-align:left;font:inherit;color:inherit}
.pcard:hover{border-color:var(--aqua)}
.pcard .name{font-weight:700;color:var(--teal);font-size:1.02em}
.answer{border-left:4px solid var(--aqua);background:var(--card);border-radius:0 10px 10px 0;padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.answer .q{font-weight:700;margin-bottom:6px}
.answer p{margin:8px 0}
.cite{display:inline-block;background:var(--watch-bg);color:var(--watch);font-weight:700;font-size:.78em;border-radius:4px;padding:0 5px}
.src{display:grid;gap:6px;margin-top:10px}
.src div{font-size:.84em;color:var(--muted)}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.84em;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.controls label{display:grid;gap:3px;font-size:.76em;color:var(--muted);font-weight:600}
.controls input,.controls select,textarea{font:inherit;font-size:.92em;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:96px;resize:vertical}
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:200px 1fr 34px;gap:10px;align-items:center;font-size:.86em}
.barrow .track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.barrow .fill{height:100%;background:var(--aqua);border-radius:4px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.topiccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:10px 1fr;gap:10px}
.topic .dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.topic b{display:block}
.footer{max-width:1380px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8em}
.hidden{display:none!important}
@media (max-width:640px){.header h1{font-size:1.3em}.tab{padding:11px 12px}.barrow{grid-template-columns:120px 1fr 30px}.askbox{flex-direction:column}}
</style>
</head>

/* ---------- Ask ---------- */
function examples(){ return [
  {q:'Is EASE tested for ochratoxin A?', route:'coa'},
  {q:'Lead levels across our core blends', route:'coa'},
  {q:'Is your coffee mold free?', route:'customer'},
  {q:'Do chlorogenic acids survive roasting?', route:'research'},
  {q:'Can we say PROTECT supports liver health?', route:'claim'}
]; }
const AWORDS = [[/\bota\b|ochratoxin/i,'OTA'],[/aflatoxin/i,'AFB1'],[/\blead\b/i,'Pb'],[/cadmium/i,'Cd'],[/arsenic/i,'As'],[/mercury/i,'Hg'],[/acrylamide/i,'ACR'],[/glyphosate/i,'GLY'],[/\bmold|mould/i,'MLD'],[/yeast/i,'YST'],[/chlorogenic|\bcga/i,'CGA'],[/caffeine/i,'CAF'],[/trigonelline/i,'TRIG']];
function detect(q){
  const prod=PRODUCT_ORDER.find(p=>new RegExp('\\b'+p.replace(' ','\\s+')+'\\b','i').test(q)) || (/decaf/i.test(q)?'CALM':null);
  const an=(AWORDS.find(([re])=>re.test(q))||[])[1]||null;
  let route='research';
  if(/can we say|claim|is it ok to say|wording/i.test(q)) route='claim';
  else if(/\bcoa\b|tested|test result|levels?|panel|lab|lot\b/i.test(q) && (prod||an)) route='coa';
  else if(/\byour\b|\bi\b|\bmy\b|customer/i.test(q)) route='customer';
  else if(prod && an) route='coa';
  return {prod, an, route};
}
function libraryMatches(q, n){
  const words=q.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3 && !['does','what','with','that','your','have','from','they','this','about','coffee','roasting'].includes(w));
  if(!words.length) return [];
  return D.bib.map(b=>[b, words.filter(w=>(b.title||'').toLowerCase().includes(w)).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||(b[0].year||0)-(a[0].year||0)).slice(0,n).map(x=>x[0]);
}
function coaAnswer(q, prod, an){
  if(prod && an){
    const r=latestFor(prod, an);
    if(!r) return `<p>No ${esc(AN[an].n)} result is on file for ${esc(prod)} in Brian's tracker. Answer: "We don't have a published ${esc(AN[an].n)} result for ${esc(prod)} yet." Escalated to the review queue.</p>`;
    const a=analyteStatus(r,an), lim=isGreenStd(r)&&GREEN[an]?(GREEN[an].max??GREEN[an].min):AN[an].lim;
    return `<p><b>${esc(prod)}</b> was last tested for ${esc(AN[an].n)} on <b>${niceDate(r.date)}</b> by ${esc(r.lab)}: <b>${esc(disp(a.x))} ${esc(AN[an].u)}</b> ${apill(a)}${lim!=null&&!AN[an].nd?` against a Health Grade limit of ${lim} ${esc(AN[an].u)}`:''}.</p>
     ${a.x&&a.x.q==='<'?`<p class="small muted">"&lt;" means below the lab's reporting limit, not zero.</p>`:''}
     ${miniPanel(prod)}`;
  }
  if(prod) return `<p>Latest results for <b>${esc(prod)}</b>, one value per analyte from its most recent test:</p>${miniPanel(prod)}`;
  if(an){
    const rows=CORE.map(p=>{ const r=latestFor(p,an); if(!r) return `<tr><td><b>${p}</b></td><td colspan="3" class="muted">No result on file</td></tr>`; const a=analyteStatus(r,an); return `<tr><td><b>${p}</b></td><td class="num">${esc(disp(a.x))} ${esc(AN[an].u)}</td><td>${apill(a)}</td><td class="small muted">${niceDate(r.date)} · ${esc(r.lab)}</td></tr>`; });
    return `<p>Latest ${esc(AN[an].n)} result for each core blend:</p>${table(['Blend','Result','Status','Tested'],rows)}`;
  }
  return '';
}
function miniPanel(prod){
  const rows=MATRIX.map(c=>{ const r=latestFor(prod,c); if(!r) return ''; const a=analyteStatus(r,c); return `<tr><td>${esc(AN[c].n)}</td><td class="num">${esc(disp(a.x))} ${esc(AN[c].u)}</td><td>${apill(a)}</td><td class="small muted">${niceDate(r.date)} · ${esc(r.lab)}</td></tr>`; }).filter(Boolean);
  return rows.length? table(['Analyte','Latest','Status','Tested'],rows) : '<p class="muted small">No results on file.</p>';
}
function answerFor(q, forced){
  const d=detect(q); let route = forced && forced!=='auto' ? forced : d.route;
  if(route==='deep') route='research';
  let body='', sources='';
  if(route==='claim'){
    body=`<p>This reads as a health claim, so it belongs in <b>Claims, Check a claim</b>, where it gets a verdict, a compliant rewrite and citations.</p><p><button class="btn ghost" type="button" data-gocheck="${esc(q)}">Open in Check a claim</button></p>`;
  } else if(route==='coa'){
    body=coaAnswer(q, d.prod, d.an) || `<p>Name a product or an analyte (for example "FLOW lead" or "acrylamide") and the Hub answers from Brian's latest results.</p>`;
    sources=`<div class="src"><div>Source: Brian's Lab Testing tracker, synced daily · <a href="${TRACKER_URL}" target="_blank" rel="noopener">open full records</a></div></div>`;
  } else if(route==='customer'){
    if(/mold|mould|mycotox/i.test(q)){

       <div class="note"><b>Internal note:</b> avoid "mold-free"; it is an absolute claim. The SOP tests every green lot and each blend yearly, not every batch.${stale.length?` Don't promise annual panels yet: ${stale.join(', ')} have no full contaminant panel in the last 12 months.`:''} Values from Brian's tracker.</div>`;
    } else {
      body=`<p class="small muted">Customer-ready reply</p><p>In the live Hub, a short customer-safe answer appears here in Purity's voice, with health language hedged ("may support", "research suggests") and an internal note listing what it drew on. Low-confidence answers go to the review queue for Jeremy and Ildi.</p>`;
    }
  } else {
    const m=libraryMatches(q,5);
    if(/chlorogenic|cga/i.test(q) && /roast/i.test(q)){
      body=`<p>Only partly. Chlorogenic acids are among the compounds that change most during roasting: as roast degree increases, total CGA content falls, part of it converts to chlorogenic acid lactones, and part is incorporated into melanoidins <span class="cite">[CITE]</span>. Light roasts retain the most CGA, but roast degree affects other compounds too, so lighter is not automatically better <span class="cite">[CITE]</span>.</p>
       <p class="small muted">Evidence grade: well established chemistry; compound-level, not a health outcome.</p>`;
    } else {
      body=`<p>In the live Hub, Claude answers from the library (1,596 papers and Ildi's book once it is in) with inline citations and an evidence grade. This mockup shows the layout and the real library matches for your words.</p>`;
    }
    sources = m.length? `<div class="src"><div><b>Retrieved from the library</b> (title matches, real entries)</div>${m.map(b=>`<div>· ${esc(b.title)}${b.year?` (${b.year})`:''}${b.doi?` · <a href="https://doi.org/${esc(b.doi)}" target="_blank" rel="noopener">DOI</a>`:''}</div>`).join('')}</div>` : '';
  }
  const routeName={coa:'COA',customer:'Customer answer',research:state.askRoute==='deep'?'Deep mode':'Research',claim:'Claim'}[route];
  return `<div class="answer"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="route">${routeName}</span><span class="q">${esc(q)}</span></div>${body}${sources}
   <div class="chips" style="margin-top:12px"><button class="chip" type="button">Helpful</button><button class="chip" type="button">Not helpful</button>${isStaff()?'<button class="chip" type="button">Promote to canon</button>':''}<button class="chip" type="button">Send to review</button></div></div>`;
}

function viewClaims(){

function claimsLibrary(){

  const high=C.filter(c=>c.risk==='High').length, health=C.filter(c=>c.category==='Health benefit').length;
  const RC={High:'fail',Medium:'watch',Low:'nd'};
  const rows=list.slice(0,120).map(c=>{ const rv=state.review[c.id]||'Unreviewed'; const open=state.claimOpen===c.id;
    return `<tr class="click" data-claim="${c.id}"><td style="max-width:440px"><b>${esc(c.claim)}</b>${(c.products||[]).length?`<div class="small muted">${esc(c.products.join(', '))}</div>`:''}</td><td class="small">${esc(c.category)}</td><td class="small">${esc(c.channel||c.src)}${c.count>1?` · ${c.count} places`:''}</td><td>${pill(RC[c.risk]||'info',c.risk)}</td><td class="small">${esc(c.evidence_type||'')}</td><td>${pill('info','Not checked')}</td><td>${pill(REVIEW_CLS[rv],rv)}</td></tr>
    ${open?`<tr><td colspan="7" style="background:var(--soft)"><div style="display:grid;gap:8px">
      <div class="small"><b>Evidence needed:</b> ${esc(c.evidence_needed||'Not specified')}</div>
      ${c.notes?`<div class="small"><b>Notes:</b> ${esc(c.notes)}</div>`:''}
      ${(c.locations||[]).length?`<div class="small"><b>Where it appears:</b> ${(c.locations||[]).map(l=>l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title||l.url)}</a>`:esc(l.title||'')).join(' · ')}</div>`:''}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><button class="btn ghost" type="button" data-gocheck="${esc(c.claim)}">Check this claim</button>
      ${isStaff()?`<label class="small muted" style="display:grid;gap:3px">Review status<select data-review="${c.id}">${REVIEW_OPTS.map(o=>`<option ${o===rv?'selected':''}>${o}</option>`).join('')}</select></label>`:'<span class="small muted">Editors and admins set review status.</span>'}</div>
    </div></td></tr>`:''}`; });
  return `<div class="grid">
   <div class="kpis">${kpi('Claims catalogued',C.length,'From Brian\'s claims library')}${kpi('High risk',high,Math.round(high/C.length*100)+'% of claims',true)}${kpi('Health benefit claims',health,'Disease or body-function language',true)}${kpi('Research-checked','0','Checker runs on demand')}</div>
   <div class="card"><h2>Claim library</h2><p class="hint">Every catalogued public claim, with where it appears, what would prove it, and its review status. Lab and research verdicts sit side by side.</p>
    <div class="controls"><label>Search<input id="cq" value="${esc(f.q)}" placeholder="Words in the claim"></label>
     <label>Category<select data-cf="cat"><option value="all">All</option>${cats.map(x=>`<option ${f.cat===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
     <label>Risk<select data-cf="risk"><option value="all">All</option>${['High','Medium','Low'].map(x=>`<option ${f.risk===x?'selected':''}>${x}</option>`).join('')}</select></label>
     <label>Source<select data-cf="src"><option value="all">All</option>${srcs.map(x=>`<option ${f.src===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>
    <p class="small muted">${list.length} claims${list.length>120?' · showing 120':''} · click a row for detail</p>
    ${table(['Claim','Category','Where','Risk','Evidence type','Research verdict','Review'],rows,'max-height:700px')}</div>
  </div>`;
}
const FLAGS=[
  {re:/\b(detox\w*|cleans\w*|protects?|repairs?|heals?|fixes)\b[^.]*\b(liver|brain|gut|heart|kidneys?|cells?)\b/i, sev:'fail', t:'Unqualified body-function claim', fix:'Name the compound and the evidence, hedge it ("may support", "associated with"), cite it, and route to Sage validation.'},
  {re:/\b(cures?|treats?|prevents?|heals?|reverses?)\b/i, sev:'fail', t:'Disease treatment or prevention language', fix:'Use structure/function wording with "may support" or "associated with", or drop it.'},
  {re:/\b(cancer|diabetes|alzheimer'?s?|parkinson'?s?|depression|anxiety|disease)\b/i, sev:'watch', t:'Names a disease', fix:'Disease names push a claim toward a drug claim. Keep to population research language with a citation, or remove.'},
  {re:/\b(detox(es|ify)?|cleanse|boosts?|superfood)\b/i, sev:'watch', t:'Wellness filler', fix:'Replace with the specific compound or process and what the evidence shows.'},
  {re:/\b(toxic|poison(ous|ing)?|dangerous)\b/i, sev:'watch', t:'Fear framing', fix:'State the test and the result plainly instead.'},
  {re:/\b(mold[- ]free|toxin[- ]free|pesticide[- ]free|zero|never|100%|every batch|purest|cleanest|best|only)\b/i, sev:'watch', t:'Absolute or superlative claim', fix:'Say what is tested and how often, matching the SOP: every green lot, each blend yearly.'},
  {re:/[—–]/, sev:'info', t:'Em or en dash', fix:'Brand rule: use commas, colons or periods.'}
];
function claimsCheck(){
  const t=state.checkText;
  let out='';
  if(t){
    const hits=FLAGS.filter(f=>f.re.test(t));
    const verdict=hits.some(h=>h.sev==='fail')?['fail','Not permitted']:hits.length?['watch','Supported with changes']:['info','Needs evidence check'];
    const preset=/mold.?free/i.test(t)&&/detox/i.test(t);
    out=`<div class="answer"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="route">Claim check</span>${pill(verdict[0],verdict[1])}</div>
     <p class="q" style="margin-top:8px">"${esc(t)}"</p>
     ${hits.length?`<h3>Flags</h3>${table(['Flag','What to do'],hits.map(h=>`<tr><td>${pill(h.sev,h.t)}</td><td class="small">${esc(h.fix)}</td></tr>`))}`:'<p class="small muted">No wording flags. The live checker would now grade the evidence for the claim.</p>'}
     ${preset?`<h3>Suggested rewrite</h3><p>Every green coffee lot is tested for mycotoxins before roasting, and finished blends are tested at independent labs. Research suggests coffee drinking is associated with markers of liver health <span class="cite">[CITE]</span>.</p>
      <h3>Evidence</h3><p class="small">Testing statement: Brian's SOP and the latest panels in COA quick view. Liver statement: observational research only, so hedge and route to Sage validation <span class="cite">[CITE]</span>.</p>`:''}
     <div class="note" style="margin-top:12px">Mockup checker: rule-based wording flags only. The live checker is today's claim auditor (compound, mechanism, bioavailability, evidence tier) plus library citations and Brian's lab data.</div>
     ${isStaff()?'<div class="chips"><button class="chip" type="button">Save to claim library</button><button class="chip" type="button">Route to Sage validation</button></div>':''}</div>`;
  }
  const recent=(D.audits||[]).map(a=>`<tr><td class="num">${niceDate(a.d.slice(0,10))}</td><td>${esc(a.t)}</td><td class="small">${a.evidence_tier!=null?'Tier '+a.evidence_tier:'·'}</td><td class="small">${esc(a.weakest_link||'')}</td><td class="small">${(a.regulatory_flags||[]).map(f=>pill('watch',f.replace(/_/g,' '))).join(' ')}</td></tr>`);
  return `<div class="grid">
   <div class="card"><h2>Check a claim</h2><p class="hint">Paste draft wording. You get a verdict, flags, a compliant rewrite and citations. Open to everyone; editors and admins set review status.</p>
    <form id="checkform"><textarea id="checktext" placeholder="e.g. Purity is mold-free and detoxes your liver.">${esc(t)}</textarea>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><button class="btn" type="submit">Check</button><button class="btn ghost" type="button" data-preset="1">Try an example</button></div></form></div>
   ${out}
   <div class="card"><h2>Recent checks</h2><p class="hint">From today's claim auditor (24 audits by 4 people since April).</p>${table(['Date','Draft','Evidence','Weakest link','Flags'],recent)}</div>
  </div>`;
}

/* ---------- Library ---------- */
function viewLibrary(){
  const body={papers:libPapers,topics:libTopics,book:libBook}[state.libSub]();
  return `${sub('libSub',[['papers','Research papers'],['topics','Browse by topic'],['book','Book compendium']])}${body}`;
}
function libPapers(){
  const q=state.libQ.toLowerCase(), T=state.libTopic;
  const topics=[...new Set(D.bib.map(b=>b.topic).filter(Boolean))].sort();
  const list=D.bib.filter(b=>(T==='all'||b.topic===T)&&(!q||(b.title||'').toLowerCase().includes(q)));
  const oa=x=>/^Yes/.test(x||'');
  const rows=list.slice(0,80).map(b=>`<tr><td><b>${esc(b.title)}</b></td><td class="num">${b.year||''}</td><td class="small">${esc(b.topic||'')}</td><td>${b.rights?(oa(b.rights)?pill('pass','Open access'):pill('info','Subscription')):''}</td><td class="small">${b.doi?`<a href="https://doi.org/${esc(b.doi)}" target="_blank" rel="noopener">DOI</a>`:''}</td></tr>`);
  return `<div class="grid">
   <div class="kpis">${kpi('Research papers','1,596','In the retrieval library')}${kpi('Catalog entries',D.bib.length.toLocaleString(),'With titles in this view')}${kpi('Open access',D.bib.filter(b=>oa(b.rights)).length,'Free full text')}${kpi('Book',"Pending","Ildi's manuscript")}</div>
   <div class="card"><h2>Research papers</h2><p class="hint">Search titles, filter by topic, export citations. Real catalog entries.</p>
    <div class="controls"><label>Search<input id="libq" value="${esc(state.libQ)}" placeholder="e.g. ochratoxin, liver, chlorogenic"></label>
     <label>Topic<select id="libtopic"><option value="all">All topics</option>${topics.map(x=>`<option ${T===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
     <button class="btn ghost" type="button">Export BibTeX</button></div>
    <p class="small muted">${list.length.toLocaleString()} matches${list.length>80?' · showing 80':''}</p>
    ${table(['Title','Year','Topic','Access','Link'],rows,'max-height:640px')}</div></div>`;
}
function libTopics(){
  return `<div class="card"><h2>Browse by topic</h2><p class="hint">The knowledge Atlas, folded into the library. Each topic opens its papers and the book chapters that cover it.</p>
   <div class="topiccards">${D.atlas.map(a=>`<div class="topic"><span class="dot" style="background:${esc(a.color||'#00665E')}"></span><div><b>${esc(a.label)}</b><span class="small muted">${esc(a.description||'')}</span></div></div>`).join('')}</div></div>`;
}
function libBook(){
  return `<div class="card"><h2>The Coffee Guide to Better Health</h2><p class="hint">Ildi Revi's book, as a chapter-by-chapter compendium paired with the primary studies behind each chapter.</p>
   <div class="note">Waiting on the full manuscript. Only the preview excerpt is in the library today. Once it arrives, each chapter (01 to 18, plus 09.5) gets a summary, its key claims and links to its studies, signed off by Ildi.</div></div>`;
}

/* ---------- Admin ---------- */
function viewAdmin(){
  const subs=[['queue','Review queue'],['trends','Question trends'],['sync','Sync status']].concat(isAdmin()?[['metrics','Metrics'],['users','Users']]:[]);
  if(!subs.some(s=>s[0]===state.adminSub)) state.adminSub='queue';
  const body={queue:admQueue,trends:admTrends,sync:admSync,metrics:admMetrics,users:admUsers}[state.adminSub]();
  return `${sub('adminSub',subs)}${body}`;
}
function admQueue(){
  const rows=D.esc.map(e=>`<tr><td class="num">${niceDate(e.d.slice(0,10))}</td><td><span class="route">${esc(e.classification)}</span></td><td class="num">${e.conf??''}</td><td style="max-width:360px">${esc(e.q)}</td><td class="small muted" style="max-width:380px">${esc(e.escalation_reason||'')}</td><td><button class="chip" type="button">Claim</button></td></tr>`);
  return `<div class="card"><h2>Review queue</h2><p class="hint">Escalated questions and canon candidates in one list, for Jeremy and Ildi. Real escalations from the current chat.</p>${table(['Date','Route','Confidence','Question','Why it escalated',''],rows,'max-height:640px')}</div>`;
}
function admTrends(){
  const max=Math.max(...D.topics.map(t=>t.n));
  return `<div class="grid2"><div class="card"><h2>Question trends</h2><p class="hint">Topics tagged on questions asked so far.</p><div class="bars">${D.topics.slice(0,14).map(t=>`<div class="barrow"><span>${esc(t.label)}</span><div class="track"><div class="fill" style="width:${(t.n/max*100).toFixed(0)}%"></div></div><span class="num">${t.n}</span></div>`).join('')}</div></div>
   <div class="card"><h2>By route</h2><p class="hint">Questions and escalations by classification.</p>${table(['Route','Questions','Escalated','Rate'],D.byclass.map(c=>`<tr><td><span class="route">${esc(c.classification)}</span></td><td class="num">${c.n}</td><td class="num">${c.esc}</td><td class="num">${Math.round(c.esc/c.n*100)}%</td></tr>`))}</div></div>`;
}
function admSync(){
  const kinds={}; D.records.forEach(r=>kinds[r.kind]=(kinds[r.kind]||0)+1);
  return `<div class="grid"><div class="kpis">${kpi('Last sync','Not running','Planned: daily, cloud task')}${kpi('Records in snapshot',D.records.length,Object.entries(kinds).map(([k,n])=>`${n} ${k}`).join(' · '))}${kpi('Newest record',niceDate(RECS[0].date).replace(/, \d{4}$/,''),RECS[0].product||RECS[0].name)}${kpi('Claims in snapshot',D.claims.length,'Imported once, then owned here')}</div>
   <div class="card"><h2>Sync status</h2><p class="hint">How the Hub stays in step with Brian's tracker.</p>${table(['Step','State'],[
    `<tr><td>Read Brian's tracker (records, standard, claims)</td><td>${pill('pending','Planned')}</td></tr>`,
    `<tr><td>Validate record shape</td><td>${pill('pending','Planned')}</td></tr>`,
    `<tr><td>Write snapshot to GitHub</td><td>${pill('watch','Needs repo push access')}</td></tr>`,
    `<tr><td>Import to Supabase and re-embed</td><td>${pill('pending','Planned')}</td></tr>`,
    `<tr><td>Alert if older than 36 hours</td><td>${pill('pending','Planned')}</td></tr>`])}</div></div>`;
}
function admMetrics(){
  return `<div class="grid"><div class="kpis">${kpi('Questions asked','39','Apr 25 to Jul 23')}${kpi('Escalated','49%','19 of 39',true)}${kpi('Avg answer time','16 s','Current chat')}${kpi('Total model cost','$1.03','All questions to date')}${kpi('Claim checks','24','4 people')}${kpi('Canon answers','6','0 active',true)}</div>
   <div class="note">Real numbers from the current dashboard, shown as the Metrics page will show them.</div></div>`;
}
function admUsers(){
  const lab={admin:'Admin',editor:'Editor',customer_service:'Customer service',user:'Legacy user'};
  return `<div class="card"><h2>Users</h2><p class="hint">Accounts by role. Names hidden in this mockup.</p>${table(['Role','Accounts','Sees'],D.roles.map(r=>`<tr><td>${esc(lab[r.role]||r.role)}</td><td class="num">${r.n}</td><td class="small">${{admin:'Everything, including deep mode, metrics and users',editor:'Everything except deep mode, metrics and users',customer_service:'Home, Ask, COA (finished products), Claims, Library',user:'Retiring: move to customer service'}[r.role]||''}</td></tr>`))}</div>`;
}

/* ---------- events ---------- */
function goProduct(p){ state.tab='coa'; state.coaSub='product'; state.product=p; render(); window.scrollTo(0,0); }
function wire(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.sub.split(':'); state[k]=v; render(); });
  document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>goProduct(b.dataset.product));
  document.querySelectorAll('[data-openrec]').forEach(b=>b.onclick=()=>{ const r=RECS.find(x=>x.id===b.dataset.openrec); if(r&&r.product&&r.kind==='product') goProduct(r.product); else if(r){ state.tab='coa'; state.coaSub='green'; render(); } });
  document.querySelectorAll('[data-gogreen]').forEach(b=>b.onclick=()=>{ state.tab='coa'; state.coaSub='green'; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{ const e=examples()[+b.dataset.example]; if(e.route==='claim'){ state.tab='claims'; state.claimsSub='check'; state.checkText=e.q; render(); return; } state.tab='ask'; state.ask=e.q; state.askRoute='auto'; render(); });
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{ state.askRoute=b.dataset.route; render(); });
  const af=document.getElementById('askform'); if(af) af.onsubmit=e=>{ e.preventDefault(); const q=document.getElementById('askq').value.trim(); if(!q) return; state.tab='ask'; state.ask=q; render(); };
  document.querySelectorAll('[data-gocheck]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); state.tab='claims'; state.claimsSub='check'; state.checkText=b.dataset.gocheck; render(); });
  document.querySelectorAll('[data-claim]').forEach(r=>r.onclick=()=>{ state.claimOpen=state.claimOpen===r.dataset.claim?null:r.dataset.claim; render(); });
  document.querySelectorAll('[data-review]').forEach(s=>{ s.onclick=e=>e.stopPropagation(); s.onchange=()=>{ state.review[s.dataset.review]=s.value; render(); }; });
  document.querySelectorAll('[data-cf]').forEach(s=>s.onchange=()=>{ state.claimF[s.dataset.cf]=s.value; render(); });
  const cq=document.getElementById('cq'); if(cq) cq.oninput=()=>{ state.claimF.q=cq.value; const pos=cq.selectionStart; render(); const n=document.getElementById('cq'); n.focus(); n.setSelectionRange(pos,pos); };
  const ps=document.getElementById('prodsel'); if(ps) ps.onchange=()=>{ state.product=ps.value; render(); };
  const cf=document.getElementById('checkform'); if(cf) cf.onsubmit=e=>{ e.preventDefault(); state.checkText=document.getElementById('checktext').value.trim(); render(); };
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ state.checkText='Purity is mold-free and detoxes your liver.'; render(); });
  const lq=document.getElementById('libq'); if(lq) lq.oninput=()=>{ state.libQ=lq.value; const pos=lq.selectionStart; render(); const n=document.getElementById('libq'); n.focus(); n.setSelectionRange(pos,pos); };
  const lt=document.getElementById('libtopic'); if(lt) lt.onchange=()=>{ state.libTopic=lt.value; render(); };
}
document.getElementById('role').onchange=e=>{ state.role=e.target.value; if(state.role==='cs'&&state.askRoute==='deep') state.askRoute='auto'; render(); };
document.getElementById('theme').onclick=()=>{ const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; };
render();
</script>
</body>
